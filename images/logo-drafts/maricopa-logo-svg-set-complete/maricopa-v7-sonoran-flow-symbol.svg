  <path fill="#0D1F3D" d="m214 260 47-48 49-17 46-54 88-22v67l-61 13-44 42-69 19Z"/>
  <path fill="#0D1F3D" d="m278 278 39-29 55-8 39-25 64-6v69H329Z"/>

  <!-- Water channel: one continuous Bézier form, clean at small sizes -->
  <path fill="#2563A8" d="M48 307c69-24 164-23 213 5 33 19 41 43 17 62-24 20-22 36 8 51 34 17 92 21 177 7-52 38-139 52-222 38-72-12-118-39-113-73 3-21 22-36 49-50 16-8 17-17 2-25-24-13-73-18-131-15Z"/>
