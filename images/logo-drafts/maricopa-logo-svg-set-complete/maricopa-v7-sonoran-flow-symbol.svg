<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Maricopa Sonoran flow symbol</title>
  <desc id="desc">An orange desert sun, three rising navy landforms, and a blue flowing water channel.</desc>

  <!-- Sonoran sun: intentionally cropped by the rising landform -->
  <path fill="#D4952E" d="M62 256a112 112 0 0 1 184-86l-77 37-49 50Z"/>

