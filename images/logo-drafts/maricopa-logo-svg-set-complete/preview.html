<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo concept preview</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f1ea;margin:0;padding:32px;color:#222}
  h1{font-size:1.3rem;margin:0 0 24px}
  .concept{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;margin-bottom:28px}
  .concept h2{margin:0 0 14px;font-size:1rem;text-transform:uppercase;letter-spacing:.04em;color:#555}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:8px;min-width:110px}
  .swatch.light{background:#fff;border:1px solid #e2e2e2}
  .swatch span{font-size:.68rem;color:#888}
  .symbol-sm{height:24px}
  .symbol-md{height:56px}
  .symbol-lg{height:96px}
  .lockup{height:60px;max-width:100%}
  .lockup-wrap{background:#fff;border:1px solid #e2e2e2;border-radius:8px;padding:16px;flex:1;min-width:320px}
</style>
</head>
<body>
<h1>Maricopa Consolidated DWID — logo concept comparison</h1>

<div class="concept">
  <h2>V1 — Ripples</h2>
  <div class="row">
    <div class="swatch light"><img class="symbol-sm" src="maricopa-v1-ripples-symbol.svg"><span>16px equiv</span></div>
    <div class="swatch light"><img class="symbol-md" src="maricopa-v1-ripples-symbol.svg"><span>header size</span></div>
    <div class="swatch light"><img class="symbol-lg" src="maricopa-v1-ripples-symbol.svg"><span>large</span></div>
    <div class="lockup-wrap"><img class="lockup" src="maricopa-v1-ripples-lockup-outlined.svg"></div>
  </div>
</div>

<div class="concept">
  <h2>V2 — Desert Horizon</h2>
  <div class="row">
    <div class="swatch light"><img class="symbol-sm" src="maricopa-v2-desert-horizon-symbol.svg"><span>16px equiv</span></div>
    <div class="swatch light"><img class="symbol-md" src="maricopa-v2-desert-horizon-symbol.svg"><span>header size</span></div>
    <div class="swatch light"><img class="symbol-lg" src="maricopa-v2-desert-horizon-symbol.svg"><span>large</span></div>
    <div class="lockup-wrap"><img class="lockup" src="maricopa-v2-desert-horizon-lockup-outlined.svg"></div>
  </div>
</div>

<div class="concept">
  <h2>V3 — MC Monogram</h2>
  <div class="row">
    <div class="swatch light"><img class="symbol-sm" src="maricopa-v3-mc-monogram-symbol.svg"><span>16px equiv</span></div>
    <div class="swatch light"><img class="symbol-md" src="maricopa-v3-mc-monogram-symbol.svg"><span>header size</span></div>
    <div class="swatch light"><img class="symbol-lg" src="maricopa-v3-mc-monogram-symbol.svg"><span>large</span></div>
    <div class="lockup-wrap"><img class="lockup" src="maricopa-v3-mc-monogram-lockup-outlined.svg"></div>
  </div>
</div>

<div class="concept">
  <h2>V4 — Water &amp; Land</h2>
  <div class="row">
    <div class="swatch light"><img class="symbol-sm" src="maricopa-v4-water-land-symbol.svg"><span>16px equiv</span></div>
    <div class="swatch light"><img class="symbol-md" src="maricopa-v4-water-land-symbol.svg"><span>header size</span></div>
    <div class="swatch light"><img class="symbol-lg" src="maricopa-v4-water-land-symbol.svg"><span>large</span></div>
    <div class="lockup-wrap"><img class="lockup" src="maricopa-v4-water-land-lockup-outlined.svg"></div>
  </div>
</div>

</body>
</html>
